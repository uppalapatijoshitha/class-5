<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Page with Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f8e9;
        }

        .main-container {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE */
        .left-section {
            width: 60%;
            background-color: #eff2eb;
            color: #0db4e2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .left-section h1 {
            font-size: 50px;
        }

        .left-section p {
            font-size: 18px;
        }

        .left-section img {
            border-radius: 50%;
        }

        /* RIGHT SIDE */
        .right-section {
            width: 40%;
            background-color: #b7d99a;
            color: #21e6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LOGIN CARD */
        .login-card {
            background-color: rgba(242, 242, 242, 0.838);
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(65, 199, 236, 0.2);
        }

        .login-card h2 {
            text-align: center;
            color: #44f0dc;
            font-size: 30px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #456b3b;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #a8c98c;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #75a85b;
        }

        /* BUTTON */
        button {
            background-color: #07eaa6;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #09eaf2;
        }

        .login-button {
            width: 100%;
        }

        /* REGISTER TEXT */
        .register-text {
            margin-top: 20px;
        }

        .register-text a {
            color: #65742e;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        /* REGISTER POPUP BACKGROUND */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        /* REGISTER CARD */
        .register-card {
            position: relative;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .register-card h2 {
            text-align: center;
            color: #456b3b;
            margin-bottom: 25px;
        }

        /* CLOSE */
        .close-button {
            position: absolute;
            top: 10px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: #5b7f4c;
        }

        /* VALIDATION POPUP */
        .message-popup {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            width: 330px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .message-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .message-popup h3 {
            color: #d9534f;
            margin: 10px 0;
        }

        .message-popup p {
            color: #555;
            margin-bottom: 20px;
        }

        .message-popup button {
            width: 100px;
        }

        /* SUCCESS */
        .success h3 {
            color: #5b963f;
        }
    </style>
</head>

<body>

    <main class="main-container">

        <!-- LEFT SECTION -->
        <section class="left-section">

            <div>
                <h1>
                    Welcome to the<br>
                    Login Page!
                </h1>

                <img src="bird forlogin.jpg"
                     alt="Welcome Logo"
                     width="150"
                     height="150">

                <p>
                    Login to access your account<br>
                    and explore our features.
                </p>
            </div>

        </section>


        <!-- RIGHT SECTION -->
        <section class="right-section">

            <div class="login-card">

                <h2>Login</h2>

                <div class="form-group">
                    <label>Email:</label>

                    <input type="email"
                           id="loginEmail"
                           placeholder="Enter your E-mail ID">
                </div>

                <div class="form-group">
                    <label>Password:</label>

                    <input type="password"
                           id="loginPassword"
                           placeholder="Enter your Password">
                </div>

                <button class="login-button"
                        onclick="loginUser()">
                    Login
                </button>

            </div>

            <p class="register-text">
                Don't have an account?
                <a onclick="openRegisterPopup()">
                    Register here
                </a>
            </p>

        </section>

    </main>


    <!-- REGISTER POPUP -->
    <div class="popup" id="registerPopup">

        <div class="register-card">

            <span class="close-button"
                  onclick="closeRegisterPopup()">
                &times;
            </span>

            <h2>Create Account</h2>

            <div class="form-group">
                <label>Name:</label>

                <input type="text"
                       id="registerName"
                       placeholder="Enter your Name">
            </div>

            <div class="form-group">
                <label>Email:</label>

                <input type="email"
                       id="registerEmail"
                       placeholder="Enter your E-mail ID">
            </div>

            <div class="form-group">
                <label>Password:</label>

                <input type="password"
                       id="registerPassword"
                       placeholder="Enter your Password">
            </div>

            <div class="form-group">
                <label>Confirm Password:</label>

                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm your Password">
            </div>

            <div class="form-group">
                <label>Phone Number:</label>

                <input type="tel"
                       id="registerPhoneNumber"
                       placeholder="Enter 10-digit Phone Number">
            </div>

            <button onclick="registerUser()">
                Register
            </button>

        </div>
    </div>


    <!-- VALIDATION MESSAGE POPUP -->
    <div class="message-popup" id="messagePopup">

        <div class="message-icon" id="messageIcon">
            ❌
        </div>

        <h3 id="messageTitle">
            Invalid Input!
        </h3>

        <p id="messageText">
            Please enter valid details.
        </p>

        <button onclick="closeMessage()">
            OK
        </button>

    </div>


    <script>

        /* OPEN REGISTER */
        function openRegisterPopup() {
            document.getElementById("registerPopup").style.display = "flex";
        }


        /* CLOSE REGISTER */
        function closeRegisterPopup() {
            document.getElementById("registerPopup").style.display = "none";
        }


        /* SHOW VALIDATION POPUP */
        function showMessage(title, text) {

            document.getElementById("messageTitle").innerText = title;

            document.getElementById("messageText").innerText = text;

            document.getElementById("messageIcon").innerText = "❌";

            document.getElementById("messagePopup").style.display = "block";
        }


        /* CLOSE VALIDATION POPUP */
        function closeMessage() {

            document.getElementById("messagePopup").style.display = "none";
        }


        /* EMAIL VALIDATION */
        function validEmail(email) {

            const pattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return pattern.test(email);
        }


        /* PHONE VALIDATION */
        function validPhone(phone) {

            const pattern =
                /^[0-9]{10}$/;

            return pattern.test(phone);
        }


        /* REGISTER FUNCTION */
        function registerUser() {

            const name =
                document.getElementById("registerName").value.trim();

            const email =
                document.getElementById("registerEmail").value.trim();

            const password =
                document.getElementById("registerPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const phone =
                document.getElementById("registerPhoneNumber").value.trim();


            /* 1. EMPTY FIELD */
            if (
                name === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === "" ||
                phone === ""
            ) {

                showMessage(
                    "Empty Fields!",
                    "Please fill in all the fields."
                );

                return;
            }


            /* 2. INVALID EMAIL */
            if (!validEmail(email)) {

                showMessage(
                    "Invalid Email!",
                    "Please enter a valid email address."
                );

                return;
            }


            /* 3. INVALID PHONE */
            if (!validPhone(phone)) {

                showMessage(
                    "Invalid Phone Number!",
                    "Phone number must contain exactly 10 digits."
                );

                return;
            }


            /* 4. PASSWORD MISMATCH */
            if (password !== confirmPassword) {

                showMessage(
                    "Password Mismatch!",
                    "Password and Confirm Password must be the same."
                );

                return;
            }


            /* SUCCESS */
            closeRegisterPopup();

            alert("Registration successful!");
        }


        /* LOGIN FUNCTION */
        function loginUser() {

            const email =
                document.getElementById("loginEmail").value.trim();

            const password =
                document.getElementById("loginPassword").value;


            /* EMPTY FIELD */
            if (email === "" || password === "") {

                showMessage(
                    "Empty Fields!",
                    "Please enter your email and password."
                );

                return;
            }


            /* INVALID EMAIL */
            if (!validEmail(email)) {

                showMessage(
                    "Invalid Email!",
                    "Please enter a valid email address."
                );

                return;
            }


            /* SUCCESS */
            alert("Login successful!");
        }

    </script>

</body>
</html>
